<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>구내식당 QR 체크</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#f1f5f9;--mut:#94a3b8;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--acc:#38bdf8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 16px;gap:12px}
  header{display:flex;justify-content:space-between;align-items:center}
  header .co{font-size:15px;color:var(--mut)}
  header .clock{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
  .meal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  .meal b{font-size:28px}
  .meal span{color:var(--mut);font-size:15px}
  #reader{width:100%;aspect-ratio:1/1;background:#000;border-radius:16px;overflow:hidden;border:3px solid var(--line)}
  #reader video{object-fit:cover}
  .hint{text-align:center;font-size:20px;font-weight:700}
  .hint small{display:block;font-size:14px;color:var(--mut);font-weight:400;margin-top:2px}
  .row{display:flex;gap:8px}
  button{font:inherit;border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--card);color:var(--tx);border:1px solid var(--line)}
  button.pri{background:var(--acc);color:#082f49;border:0;font-size:22px;padding:18px}
  .grow{flex:1}
  .badge{font-size:13px;color:var(--warn);text-align:center;min-height:18px}
  /* 결과 오버레이 */
  #ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:50}
  #ov.ok{background:var(--ok);display:flex}
  #ov.bad{background:var(--bad);display:flex}
  #ov.warn{background:var(--warn);display:flex}
  #ov.wait{background:rgba(15,23,42,.85);display:flex}
  #ov .ic{font-size:110px;line-height:1}
  #ov .t1{font-size:46px;font-weight:900;margin-top:8px;word-break:keep-all}
  #ov .t2{font-size:24px;margin-top:8px;word-break:keep-all}
  #ov .t3{font-size:18px;margin-top:14px;opacity:.9}
  /* 설정 */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
  .panel h2{margin:0 0 4px;font-size:20px}
  label{font-size:14px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
  input,select{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--tx);width:100%}
  .chk{flex-direction:row;align-items:center;gap:10px;color:var(--tx)}
  .chk input{width:22px;height:22px}
  .msg{font-size:14px;min-height:20px}
  #kbd{position:absolute;left:-9999px;opacity:0}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <!-- 최초 설정 화면 -->
  <section id="setup" class="panel hidden">
    <h2>스캔 휴대폰 설정</h2>
    <label>웹앱 주소 (구글 시트 메뉴 › 스캔 화면 연결정보)
      <input id="fUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <label>접속토큰
      <input id="fToken" autocomplete="off"></label>
    <label>기기 이름 (기록에 남음)
      <input id="fDevice" value="식당폰1"></label>
    <label>카메라
      <select id="fCam">
        <option value="user">전면 카메라 (휴대폰을 직원 쪽으로 세워둘 때 · 권장)</option>
        <option value="environment">후면 카메라</option>
      </select></label>
    <label class="chk"><input type="checkbox" id="fKbd"> 블루투스/USB 바코드 스캐너도 함께 사용</label>
    <div class="msg" id="fMsg"></div>
    <div class="row">
      <button class="grow pri" id="btnSave">연결 테스트 후 저장</button>
    </div>
    <button id="btnCancel" class="hidden">취소</button>
  </section>

  <!-- 시작 화면 -->
  <section id="start" class="hidden" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px">
    <div class="hint" style="font-size:26px">구내식당 QR 체크<small id="startCo"></small></div>
    <button class="pri" id="btnStart">▶ 스캔 시작</button>
    <div class="hint"><small>매일 처음 한 번만 누르면 됩니다 (카메라·소리·화면 켜짐 유지 활성화)</small></div>
  </section>

  <!-- 스캔 화면 -->
  <section id="main" class="hidden" style="display:flex;flex-direction:column;gap:12px;flex:1">
    <header><div class="co" id="co">구내식당</div><div class="clock" id="clock">--:--</div></header>
    <div class="meal"><b id="mealNow">-</b><span id="mealInfo">오늘 0명</span></div>
    <div id="reader"></div>
    <div class="hint">카드의 QR을 화면에 비춰주세요<small>초록 화면 + "띵" 소리가 나면 완료</small></div>
    <div class="badge" id="queueBadge"></div>
    <div class="row">
      <button class="grow" id="btnManual">카드 미지참 (사번 입력)</button>
      <button id="btnCfg">⚙</button>
    </div>
  </section>
</div>

<div id="ov"><div class="ic" id="ovIc"></div><div class="t1" id="ovT1"></div><div class="t2" id="ovT2"></div><div class="t3" id="ovT3"></div></div>
<input id="kbd" autocomplete="off">

<script>
const KEY = 'dgmeal_cfg', QKEY = 'dgmeal_queue', EKEY = 'dgmeal_emps', TKEY = 'dgmeal_today';
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwwHqfqARTLsl5WTb7Ycd16pVfq2hXp1ChOF3FidwpN9a0oIBAGc0R3fLat6m8IIE59/exec';
const $ = id => document.getElementById(id);
let cfg = load(KEY) || null;
let meals = [], qr = null, actx = null, wakeLock = null;
let busy = false, lastCode = '', lastAt = 0, ovTimer = null, counts = {};
let emps = load(EKEY), today = load(TKEY) || { date:'', items:[] };

function load(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function save(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function show(id){ ['setup','start','main'].forEach(s => $(s).classList.toggle('hidden', s!==id)); }

/* ---------- 서버 통신 ---------- */
async function api(payload, c){
  c = c || cfg;
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 40000);   // 구글 서버 첫 응답이 느릴 수 있어 넉넉히
  try {
    const res = await fetch(c.url, { method:'POST', body: JSON.stringify(Object.assign({ token:c.token }, payload)), signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } finally { clearTimeout(to); }
}

/* ---------- 설정 ---------- */
function openSetup(){
  $('fUrl').value = cfg?.url || DEFAULT_URL; $('fToken').value = cfg?.token || '';
  $('fDevice').value = cfg?.device || '식당폰1'; $('fCam').value = cfg?.cam || 'user';
  $('fKbd').checked = !!cfg?.kbd; $('btnCancel').classList.toggle('hidden', !cfg);
  $('fMsg').textContent = ''; show('setup');
}
$('btnSave').onclick = async () => {
  const c = { url:$('fUrl').value.replace(/\s+/g,''), token:$('fToken').value.replace(/\s+/g,''), device:$('fDevice').value.trim()||'식당폰',
              cam:$('fCam').value, kbd:$('fKbd').checked };
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(c.url)) { $('fMsg').textContent = '웹앱 주소는 https://script.google.com/…/exec 형식이어야 합니다'; return; }
  $('fMsg').textContent = '연결 확인 중…';
  try {
    const r = await api({ action:'ping' }, c);
    if (r.status !== 'ok') { $('fMsg').textContent = '❌ ' + (r.message || '연결 실패'); return; }
    cfg = c; save(KEY, cfg); meals = r.meals || [];
    $('fMsg').textContent = '✅ 연결 성공: ' + (r.company || '');
    await stopCam(); location.reload();
  } catch(e){ $('fMsg').textContent = '❌ 연결 실패: 웹앱 주소가 정확한지(한 글자라도 다르면 실패), 인터넷이 연결됐는지 확인하세요. (' + e.message + ')'; }
};
$('btnCancel').onclick = () => show('start');
$('btnCfg').onclick = async () => { if (confirm('설정 화면으로 이동할까요?')) { await stopCam(); openSetup(); } };

/* ---------- 시작 ---------- */
$('btnStart').onclick = async () => {
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  await keepAwake();
  show('main');
  await startCam();
  if (cfg.kbd) armKeyboard();
  flushQueue();
};

async function startCam(){
  qr = new Html5Qrcode('reader', { formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE], verbose:false });
  try {
    await qr.start({ facingMode: cfg.cam || 'user' },
      { fps: 12, qrbox: (w,h) => { const s = Math.floor(Math.min(w,h)*0.72); return { width:s, height:s }; } },
      t => onCode(t, false), () => {});
  } catch(e) {
    showOv('bad','📷','카메라 오류','카메라 권한을 허용했는지 확인하세요\n' + e, 6000);
  }
}
async function stopCam(){ try { if (qr && qr.isScanning) await qr.stop(); } catch(e){} }

async function keepAwake(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('main').classList.contains('hidden')) keepAwake(); });

/* 외장 바코드 스캐너 (키보드처럼 입력 후 Enter) */
function armKeyboard(){
  const k = $('kbd'); k.focus();
  k.addEventListener('keydown', e => { if (e.key === 'Enter') { const v = k.value; k.value = ''; onCode(v, false); } });
  setInterval(() => { if (document.activeElement !== k && !busy) k.focus(); }, 1500);
}

/* ---------- 스캔 처리 ---------- */
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function getToday(){ const d = todayStr(); if (today.date !== d) { today = { date:d, items:[] }; save(TKEY, today); } return today; }
function hhmm(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

/* 직원명부를 휴대폰에 내려받아 두고 즉시 판정 (서버 기록은 뒤에서 전송) */
async function loadEmps(){
  try { const r = await api({ action:'employees' }); if (r.status === 'ok') { emps = { at: Date.now(), list: r.employees || [] }; save(EKEY, emps); } } catch(e){}
}
function localDecide(code, manual){
  const e = manual ? emps.list.find(x => x.id === code) : emps.list.find(x => x.card === code.toUpperCase());
  const m = curMeal(), now = hhmm();
  if (!e) return { ok:false, result:'미등록', message: manual ? '등록되지 않은 사번입니다' : '등록되지 않았거나 사용 중지된 카드입니다' };
  if (!m) return { ok:false, result:'시간외', message:'지금은 식사 인정 시간이 아닙니다', e };
  const t = getToday(), mine = t.items.filter(i => i.id === e.id), same = mine.find(i => i.meal === m.meal);
  if (same) return { ok:false, result:'중복', message:`오늘 ${m.meal} 이미 처리됨 (${same.time})`, e };
  if (e.type !== '3식' && mine.length >= 1) return { ok:false, result:'1식초과', message:`1식 대상자 · 오늘 ${mine[0].meal} 이미 식사 (${mine[0].time})`, e };
  t.items.push({ id:e.id, meal:m.meal, time:now }); save(TKEY, t);
  return { ok:true, result:'정상', e, meal:m.meal, time:now, count: t.items.filter(i => i.meal === m.meal).length };
}

async function onCode(text, manual){
  const code = String(text || '').trim();
  if (!code || busy) return;
  const now = Date.now();
  if (!manual && code === lastCode && now - lastAt < 6000) return;   // 같은 카드 연속 인식 방지
  lastCode = code; lastAt = now; busy = true;

  // ① 빠른 모드: 휴대폰에서 즉시 판정 → 서버에는 뒤에서 기록
  if (emps && emps.list && emps.list.length && meals.length) {
    const r = localDecide(code, manual);
    if (r.ok) { counts[r.meal] = r.count; renderMeal(); showOv('ok','✔', r.e.name, `${r.e.dept} · ${r.meal}`, `${r.e.type} · ${r.time}`); beep(true); }
    else { showOv('bad','✖', r.result, r.message, r.e ? `${r.e.name} ${r.e.dept}` : ''); beep(false); if (r.result === '미등록') loadEmps(); }
    enqueue({ code, manual: manual ? 1 : 0, ts: now });
    flushQueue();
    setTimeout(() => { hideOv(); busy = false; }, r.ok ? 1200 : 2500);
    return;
  }

  // ② 명부를 아직 못 받은 경우: 서버에 직접 확인 (느림)
  showOv('wait','⏳','확인 중…','', 0);
  let hold = 2000;
  try {
    const r = await api({ action:'scan', code, device: cfg.device, manual: manual ? 1 : 0 });
    if (r.status === 'ok') {
      if (r.meal) counts[r.meal] = r.mealCount;
      renderMeal();
      if (r.ok) { showOv('ok','✔', r.name, `${r.dept} · ${r.meal}`, `${r.type} · ${r.time}`); beep(true); hold = 1500; }
      else { showOv('bad','✖', r.result, r.message, r.name ? `${r.name} ${r.dept}` : ''); beep(false); hold = 3000; }
    } else {
      showOv('bad','⚠', r.status === 'denied' ? '접속 오류' : '처리 오류', r.message || '', '관리자에게 문의'); beep(false); hold = 4000;
    }
  } catch(e) {
    enqueue({ code, manual: manual ? 1 : 0, ts: now });
    showOv('warn','📶','임시 저장됨','인터넷 연결이 불안정합니다', '연결되면 자동으로 전송됩니다 · 입장하셔도 됩니다');
    beep(true); hold = 2600;
  }
  setTimeout(() => { hideOv(); busy = false; }, hold);
}

$('btnManual').onclick = () => {
  const id = prompt('사번을 입력하세요 (카드 미지참·분실 시)');
  if (id && id.trim()) onCode(id.trim(), true);
};

/* ---------- 오프라인 대기열 ---------- */
function getQ(){ return load(QKEY) || []; }
function enqueue(item){ const q = getQ(); q.push(item); save(QKEY, q); badge(); }
function badge(){ const n = getQ().filter(i => Date.now() - i.ts > 60000).length; $('queueBadge').textContent = n ? `⚠ 시트 미전송 ${n}건 (인터넷 확인 · 자동 재전송)` : ''; }
setInterval(badge, 15000);
let flushing = false, flushAgain = false;
async function flushQueue(){
  if (!cfg) return;
  if (flushing) { flushAgain = true; return; }
  flushing = true;
  try {
    let q = getQ();
    while (q.length) {
      const it = q[0];
      try { await api({ action:'scan', code: it.code, manual: it.manual, ts: it.ts, queued: (Date.now() - it.ts > 60000) ? 1 : 0, device: cfg.device }); }
      catch(e){ break; }   // 서버 응답을 받았으면(결과와 무관) 대기열에서 제거
      q.shift(); save(QKEY, q);
    }
  } finally { flushing = false; badge(); if (flushAgain) { flushAgain = false; flushQueue(); } }
}
setInterval(flushQueue, 20000);
window.addEventListener('online', flushQueue);

/* ---------- 화면 ---------- */
function showOv(cls, ic, t1, t2, t3){
  clearTimeout(ovTimer);
  const o = $('ov'); o.className = cls;
  $('ovIc').textContent = ic; $('ovT1').textContent = t1 || ''; $('ovT2').textContent = t2 || ''; $('ovT3').textContent = t3 || '';
  if (typeof t3 === 'number') $('ovT3').textContent = '';
  if (cls === 'bad' && ic === '📷') ovTimer = setTimeout(hideOv, 6000);
}
function hideOv(){ $('ov').className = ''; }

function curMeal(){
  const d = new Date(), t = d.getHours()*60 + d.getMinutes();
  const m2 = s => { const a = String(s||'').match(/(\d{1,2}):(\d{2})/); return a ? (+a[1])*60 + (+a[2]) : null; };
  return meals.find(m => { const s = m2(m.start), e = m2(m.end); return s != null && e != null && t >= s && t <= e; });
}
function renderMeal(){
  if (!meals.length) { $('mealNow').textContent = '시간표 불러오는 중'; $('mealInfo').textContent = ''; return; }
  const m = curMeal();
  $('mealNow').textContent = m ? m.meal : '식사시간 아님';
  $('mealInfo').textContent = m ? `${m.start}~${m.end} · 오늘 ${counts[m.meal] ?? '-'}명` : (meals.map(x => `${x.meal} ${x.start}`).join(' · '));
}
function tick(){
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit', hour12:false });
  renderMeal();
  // 자정이 지나면 카운트 초기화
  const day = d.toDateString(); if (tick.day && tick.day !== day) counts = {}; tick.day = day;
}

function beep(ok){
  if (navigator.vibrate) navigator.vibrate(ok ? 120 : [220,120,220]);
  if (!actx) return;
  if (actx.state === 'suspended') actx.resume();
  const seq = ok ? [[1318,0.09],[1760,0.14]] : [[330,0.22],[262,0.32]];
  let t = actx.currentTime;
  seq.forEach(([f,d]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.02); t += d + 0.04;
  });
}

/* ---------- 시간표 불러오기 ---------- */
async function loadMeals(){
  try {
    const r = await api({ action:'ping' });
    if (r.status === 'ok') { meals = r.meals || []; $('co').textContent = r.company || '구내식당'; $('startCo').textContent = r.company || ''; }
    else $('startCo').textContent = '⚠ ' + (r.message || '연결 오류') + ' — ⚙ 설정 확인';
  } catch(e){ if (!meals.length) $('startCo').textContent = '⚠ 서버 연결 지연 — 1분 후 자동 재시도. 스캔은 그대로 가능합니다.'; }
  renderMeal();
}

/* ---------- 초기화 ---------- */
(async function init(){
  badge();
  if (!cfg) { openSetup(); return; }
  show('start');
  $('startCo').textContent = '연결 확인 중… (첫 연결은 20초 정도 걸릴 수 있습니다)';
  tick(); setInterval(tick, 1000 * 15);
  await Promise.all([loadMeals(), loadEmps()]);
  setInterval(loadMeals, 1000 * 60 * 30);
  setInterval(loadEmps, 1000 * 60 * 10);   // 10분마다 직원명부 갱신 (신규·퇴사 반영)   // 30분마다 시간표 갱신 (설정 시트 변경 반영)
  setInterval(() => { if (!meals.length) loadMeals(); }, 1000 * 60);
})();
</script>
</body>
</html>
